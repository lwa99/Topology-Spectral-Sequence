[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-spectral-sequence"
version = "0.1.0"
description = "Exact-domain algebraic spectral-sequence computation with Smith normal form"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Wenao Liu" },
  { name = "Yuankun Zou" },
  { name = "Yu Xin" },
]
dependencies = [
  "sympy>=1.12",
  "Jinja2>=3.1",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["seqsee_main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.setuptools.data-files]
"." = ["input_schema.json", "template.html.jinja"]
"THIRD_PARTY_LICENSES" = ["THIRD_PARTY_LICENSES/SeqSee.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
